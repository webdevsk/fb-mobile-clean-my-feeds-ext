name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: |
          PKG_VERSION=$(jq -r .version package.json)
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          echo "pkg=$PKG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — package.json is $PKG_VERSION but tag is $GITHUB_REF_NAME"
            exit 1
          fi
          echo "✅ Version confirmed: $PKG_VERSION"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Zip Chrome extension
        run: bun run zip

      - name: Zip Firefox extension
        run: bun run zip:firefox

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.pkg }} – Clean My Feeds for Facebook Mobile
          body: |
            ## 🧩 Clean My Feeds for Facebook Mobile v${{ steps.version.outputs.pkg }}

            ### Download

            | Browser | File |
            | --- | --- |
            | Chrome / Edge (Chromium) | `*-chrome.zip` |
            | Firefox | `*-firefox.zip` |
          files: .output/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
