name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Zip Chrome extension
        run: bun run zip

      - name: Zip Firefox extension
        run: bun run zip:firefox

      - name: List output zips
        run: ls -lh .output/*.zip

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          body: |
            ## 🧩 Clean My Feeds for Facebook Mobile ${{ github.ref_name }}

            ### Download

            | Browser | File |
            | --- | --- |
            | Chrome / Edge (Chromium) | `*-chrome.zip` |
            | Firefox | `*-firefox.zip` |
          files: .output/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true
